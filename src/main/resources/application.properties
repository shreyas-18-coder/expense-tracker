spring.application.name=expense-tracker

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/expense_tracker_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTMustBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration=86400000

server.port=${PORT:8080}