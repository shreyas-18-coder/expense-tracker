<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budgets - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
<nav class="navbar">
    <h2>Expense Tracker</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="analytics.html">Analytics</a>
        <a href="import.html">Import CSV</a>
        <button id="logoutBtn">Logout</button>
    </div>
</nav>

<main class="dashboard-content">
    <h1>Budgets</h1>

    <div class="form-section">
        <h3>Set a Budget</h3>
        <form id="budgetForm">
            <div class="form-row">
                <div>
                    <label>Category</label>
                    <select id="categorySelect" required></select>
                </div>
                <div>
                    <label>Monthly Limit (₹)</label>
                    <input type="number" id="monthlyLimit" step="0.01" required>
                </div>
                <div>
                    <label>Month</label>
                    <select id="monthSelect" required></select>
                </div>
                <div>
                    <label>Year</label>
                    <input type="number" id="yearInput" value="2026" required>
                </div>
            </div>
            <button type="submit">Set Budget</button>
        </form>
        <p id="formError" class="error"></p>
    </div>

    <div class="filter-section">
        <label>Viewing:</label>
        <select id="viewMonth"></select>
        <input type="number" id="viewYear" value="2026" style="width: 80px;">
        <button id="loadBudgets">Load</button>
    </div>

    <div id="budgetsList">Select a month and click Load.</div>
</main>

<script src="js/api.js"></script>
<script src="js/budgets.js"></script>
</body>
</html>
