<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
<nav class="navbar">
    <h2>Expense Tracker</h2>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="analytics.html">Analytics</a>
        <a href="import.html">Import CSV</a>
        <button id="logoutBtn">Logout</button>
    </div>
</nav>

<main class="dashboard-content">
    <h1>Dashboard</h1>

    <div class="summary-cards">
        <div class="card">
            <h3>Total Balance</h3>
            <p id="totalBalance">Loading...</p>
        </div>
        <div class="card">
            <h3>Income (This Month)</h3>
            <p id="totalIncome">Loading...</p>
        </div>
        <div class="card">
            <h3>Expense (This Month)</h3>
            <p id="totalExpense">Loading...</p>
        </div>
    </div>

    <h2>Your Accounts</h2>
    <div id="accountsList">Loading accounts...</div>
</main>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
